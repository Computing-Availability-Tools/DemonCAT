[demoncat]
state_file = ~/.demoncat/state.json
log_level  = warn

# ===== cpu 模块（2 条）=====
[fault.rCPU_overload]
module          = cpu
desc            = CPU 过载（多核 burn）
script          = src/scripts/cpu/cpu_overload.sh
supported_ops   = inject,clean,query
required_params = cores

[fault.rCPU_core_offline]
module          = cpu
desc            = CPU 核下线（sysfs offline）
script          = src/scripts/cpu/cpu_core_offline.sh
supported_ops   = inject,clean,query
required_params = cores

# ===== network 模块（11 条）=====
[fault.rNET_delay]
module          = network
desc            = 网络延时（tc netem delay）
script          = src/scripts/network/net_delay.sh
supported_ops   = inject,clean,query
required_params = iface,delay_ms

[fault.rNET_loss]
module          = network
desc            = 网络丢包（tc netem loss）
script          = src/scripts/network/net_loss.sh
supported_ops   = inject,clean,query
required_params = iface,loss_pct

[fault.rNET_reorder]
module          = network
desc            = 网络乱序（tc netem reorder）
script          = src/scripts/network/net_reorder.sh
supported_ops   = inject,clean,query
required_params = iface,reorder_pct

[fault.rNET_down]
module          = network
desc            = 网卡 down（ip link set down）
script          = src/scripts/network/net_down.sh
supported_ops   = inject,clean,query
required_params = iface

[fault.rNET_degrade]
module          = network
desc            = 网络降速（ethtool speed）
script          = src/scripts/network/net_degrade.sh
supported_ops   = inject,clean,query
required_params = iface
optional_params = speed_mbps

[fault.rNET_port_occupy]
module          = network
desc            = 端口占用（socket holder）
script          = src/scripts/network/net_port_occupy.sh
supported_ops   = inject,clean,query
required_params = port
optional_params = protocol

[fault.rNET_service_stop]
module          = network
desc            = 服务停止（systemctl stop）
script          = src/scripts/network/net_service_stop.sh
supported_ops   = inject,clean,query
required_params = service

[fault.rNET_link_flap]
module          = network
desc            = 链路闪断（循环 down/up）
script          = src/scripts/network/net_link_flap.sh
supported_ops   = inject,clean,query
required_params = iface
optional_params = cycle_sec,count

[fault.rNET_bw_limit]
module          = network
desc            = 带宽限制（tc tbf）
script          = src/scripts/network/net_bw_limit.sh
supported_ops   = inject,clean,query
required_params = iface,rate_kbps

[fault.rNET_jitter]
module          = network
desc            = 网络抖动（tc netem jitter）
script          = src/scripts/network/net_jitter.sh
supported_ops   = inject,clean,query
required_params = iface,delay_ms,jitter_ms

[fault.rNET_tcp_loss]
module          = network
desc            = TCP 丢包（iptables DROP）
script          = src/scripts/network/net_tcp_loss.sh
supported_ops   = inject,clean,query
required_params = port
optional_params = direction

# ===== process 模块（4 条）=====
[fault.rPROC_exit]
module          = process
desc            = 进程异常退出（kill -9，不可恢复）
script          = src/scripts/process/proc_exit.sh
supported_ops   = inject
required_params = pid

[fault.rPROC_dstate]
module          = process
desc            = D 态进程（spawn helper）
script          = src/scripts/process/proc_dstate.sh
supported_ops   = inject,clean,query
required_params = count

[fault.rPROC_hang]
module          = process
desc            = 进程挂起（kill -STOP）
script          = src/scripts/process/proc_hang.sh
supported_ops   = inject,clean,query
required_params = pid

[fault.rPROC_zstate]
module          = process
desc            = 僵尸进程（spawn 僵尸父进程）
script          = src/scripts/process/proc_zstate.sh
supported_ops   = inject,clean,query
required_params = count

# ===== storage 模块（1 条）=====
[fault.rDISK_write_overload]
module          = storage
desc            = 磁盘写过载（dd/fio）
script          = src/scripts/storage/disk_write_overload.sh
supported_ops   = inject,clean,query
required_params = device
optional_params = workers

