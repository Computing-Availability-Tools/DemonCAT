supported_ops   = inject,clean,query
required_params = chip,dir,ip

[fault.rNPU_iproute_add]
module          = npu
desc            = Add ip route
script          = config/scripts/npu/iproute_add.sh
supported_ops   = inject,clean,query
required_params = chip,ip,ip_mask,via,dev,table

[fault.rNPU_iproute_del]
