desc            = Delete ip route
script          = config/scripts/npu/iproute_del.sh
supported_ops   = inject,clean,query
required_params = chip,ip,ip_mask,table

[fault.rNPU_bw_limit]
module          = npu
desc            = RoCE bandwidth shaping limit
script          = config/scripts/npu/bw_limit.sh
supported_ops   = inject,clean,query
required_params = chip,bw_limit

[fault.rNPU_mtu_mismatch]
