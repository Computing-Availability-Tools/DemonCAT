name: E2E_Test

# 单一入口：一次 push/PR 只跑这一条 workflow（取代旧的 pr_test_light + pr_test_full）。
#
# Light 层（lint/unit/e2e-light）对所有触发都跑（fork 安全，ubuntu）。
# Full 层（e2e-full NPU / clang-tidy / coverage）仅在源仓库 Computing-Availability-Tools/DemonCAT 跑：
#   push（合并验证） 或 PR 带 ready/ready-for-test 标签（fork PR 也可，经 /e2e 评论加标签触发，vllm 式）。
# PR labeled 非 ready 标签 → 全部跳过（省 CI）。
# 参考 vllm-ascend pr_test.yaml。

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - edited  # 改 PR 标题/描述后重跑(否则改标题不会触发新 run,旧快照的标题校验会一直卡)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read   # download-artifact v5 走 actions artifacts 端点，需该 scope（否则 403 被吞→Gate 永远 PASS）

# 源仓库全名（Full 仅在此 repo 跑：NPU runner + secrets 在此）
# fork 仓库 push 时 github.repository != 此值 → Full 跳过（fork 无 NPU runner）。

jobs:
  # ───────── Light 层（fork 安全，ubuntu）─────────
  lint:
    name: Lint (pre-commit + PR title)
    if: ${{ github.event.action != 'labeled' || contains(fromJSON('["ready","ready-for-test"]'), github.event.label.name) }}
    uses: ./.github/workflows/_pre_commit.yaml

  unit-test:
    name: Unit tests (${{ matrix.runner }})
    needs: lint
    if: ${{ always() && needs.lint.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    uses: ./.github/workflows/_unit_test.yaml
    with:
      runner: ${{ matrix.runner }}
      mode: regular

  e2e-light:
    name: E2E smoke (${{ matrix.runner }})
    needs: lint
    if: ${{ always() && needs.lint.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    uses: ./.github/workflows/_e2e_test.yaml
    with:
      runner: '["${{ matrix.runner }}"]'
      # 轻量冒烟(marker 选择, 实际 39 条): P0 非硬件非 root(用户态) + 精选 P1 smoke。
      # NPU/rNET(eth0 硬编码会打断 GHA)/core_offline/边界/P2 留 full。非 root, ubuntu 安全。
      mark: "(P0 and not hardware and not root) or (P1 and smoke and not hardware and not root)"
      run-as-root: false

  # ───────── Full 层（仅源仓库 + push 或 PR+ready 标签）─────────
  # 拆分非 NPU / NPU 并行：非 NPU 跑 ubuntu-24.04-arm（快），NPU 跑 self-hosted（需硬件）。
  e2e-full-ubuntu-nonnet:
    name: E2E full non-NPU non-net (ubuntu-arm)
    needs: lint
    if: >-
      ${{ always() && needs.lint.result == 'success'
          && github.repository == 'Computing-Availability-Tools/DemonCAT'
          && (github.event_name == 'push'
              || (github.event_name == 'pull_request'
                  && (contains(github.event.pull_request.labels.*.name, 'ready')
                      || contains(github.event.pull_request.labels.*.name, 'ready-for-test')))) }}
    uses: ./.github/workflows/_e2e_test.yaml
    with:
      runner: '["ubuntu-24.04-arm"]'
      mark: "not hardware and not net"
      run-as-root: false
      artifact-name: full-ubuntu-nonnet

  e2e-full-ubuntu-qdisc:
    name: E2E full non-NPU net-qdisc (ubuntu-arm)
    needs: lint
    if: >-
      ${{ always() && needs.lint.result == 'success'
          && github.repository == 'Computing-Availability-Tools/DemonCAT'
          && (github.event_name == 'push'
              || (github.event_name == 'pull_request'
                  && (contains(github.event.pull_request.labels.*.name, 'ready')
                      || contains(github.event.pull_request.labels.*.name, 'ready-for-test')))) }}
    uses: ./.github/workflows/_e2e_test.yaml
    with:
      runner: '["ubuntu-24.04-arm"]'
      mark: "not hardware and (rnet_bw_limit or rnet_degrade or rnet_jitter or rnet_reorder or rnet_delay or rnet_loss)"
      run-as-root: false
      artifact-name: full-ubuntu-qdisc

  e2e-full-ubuntu-netother:
    name: E2E full non-NPU net-other (ubuntu-arm)
    needs: lint
    if: >-
      ${{ always() && needs.lint.result == 'success'
          && github.repository == 'Computing-Availability-Tools/DemonCAT'
          && (github.event_name == 'push'
              || (github.event_name == 'pull_request'
                  && (contains(github.event.pull_request.labels.*.name, 'ready')
                      || contains(github.event.pull_request.labels.*.name, 'ready-for-test')))) }}
    uses: ./.github/workflows/_e2e_test.yaml
    with:
      runner: '["ubuntu-24.04-arm"]'
      mark: "not hardware and net and not (rnet_bw_limit or rnet_degrade or rnet_jitter or rnet_reorder or rnet_delay or rnet_loss)"
      run-as-root: false
      artifact-name: full-ubuntu-netother

  e2e-full-npu:
    name: E2E full NPU (self-hosted)
    needs: lint
    if: >-
      ${{ always() && needs.lint.result == 'success'
          && github.repository == 'Computing-Availability-Tools/DemonCAT'
          && (github.event_name == 'push'
              || (github.event_name == 'pull_request'
                  && (contains(github.event.pull_request.labels.*.name, 'ready')
                      || contains(github.event.pull_request.labels.*.name, 'ready-for-test')))) }}
    uses: ./.github/workflows/_e2e_test.yaml
    with:
      # 自托管 NPU runner（含 hccn_tool/真实 NPU 硬件），仅跑 NPU 用例
      runner: '["self-hosted", "npu-server", "ARM64"]'
      mark: "hardware"
      run-as-root: true
      artifact-name: full-npu

  clang-tidy:
    name: clang-tidy (advisory)
    needs: lint
    if: >-
      ${{ always() && needs.lint.result == 'success'
          && github.repository == 'Computing-Availability-Tools/DemonCAT'
          && (github.event_name == 'push'
              || (github.event_name == 'pull_request'
                  && (contains(github.event.pull_request.labels.*.name, 'ready')
                      || contains(github.event.pull_request.labels.*.name, 'ready-for-test')))) }}
    uses: ./.github/workflows/_clang_tidy.yaml

  coverage:
    name: Coverage (gcov → Codecov)
    needs: lint
    if: >-
      ${{ always() && needs.lint.result == 'success'
          && github.repository == 'Computing-Availability-Tools/DemonCAT'
          && (github.event_name == 'push'
              || (github.event_name == 'pull_request'
                  && (contains(github.event.pull_request.labels.*.name, 'ready')
                      || contains(github.event.pull_request.labels.*.name, 'ready-for-test')))) }}
    uses: ./.github/workflows/_unit_test.yaml
    with:
      runner: ubuntu-latest
      coverage: true
      mode: full

  ci-gate:
    name: CI Gate
    needs: [lint, unit-test, e2e-light, e2e-full-ubuntu-nonnet, e2e-full-ubuntu-qdisc, e2e-full-ubuntu-netother, e2e-full-npu, clang-tidy, coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download e2e artifacts (to check actual test results)
        if: ${{ needs.e2e-full-ubuntu-nonnet.result == 'failure' || needs.e2e-full-ubuntu-qdisc.result == 'failure' || needs.e2e-full-ubuntu-netother.result == 'failure' }}
        uses: actions/download-artifact@v5
        with:
          pattern: e2e-full-ubuntu-*
          path: e2e-artifacts
      - name: Check required jobs
        env:
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit-test.result }}
          E2EL: ${{ needs.e2e-light.result }}
          E2UNN: ${{ needs.e2e-full-ubuntu-nonnet.result }}
          E2UQ: ${{ needs.e2e-full-ubuntu-qdisc.result }}
          E2UO: ${{ needs.e2e-full-ubuntu-netother.result }}
          E2EN: ${{ needs.e2e-full-npu.result }}
          CLANG: ${{ needs.clang-tidy.result }}
          COV: ${{ needs.coverage.result }}
        run: |
          set -eu
          echo "=== PR CI Gate Summary ==="
          echo "lint:               ${LINT}"
          echo "unit-test:          ${UNIT}"
          echo "e2e-light:          ${E2EL}"
          echo "e2e-full-nonnet:    ${E2UNN}"
          echo "e2e-full-qdisc:     ${E2UQ}"
          echo "e2e-full-netother:  ${E2UO}"
          echo "e2e-full-npu:      ${E2EN}"
          echo "clang-tidy:        ${CLANG} (advisory)"
          echo "coverage:          ${COV} (advisory)"
          # lint/unit/e2e-light：必须成功或跳过
          for r in "${LINT}" "${UNIT}" "${E2EL}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::Required light job did not succeed: ${r}"; exit 1 ;;
            esac
          done
          # e2e-full-npu：跑了须成功；未触发则 skipped（放行）
          case "${E2EN}" in
            success|skipped) ;;
            *) echo "::error::E2E full NPU did not succeed: ${E2EN}"; exit 1 ;;
          esac
          # e2e-full-ubuntu-*：ARM runner 偶尔出现"step conclusion 丢失"伪失败
          # （runner 与 GitHub 连接超时后 job 标失败，但 pytest 实际 0 FAIL）。
          # 区分真实失败和伪失败：下载各 job 自己的 JUnit XML，逐个判定真实 FAIL > 0 才阻断。
          for pair in "nonnet:${E2UNN}" "qdisc:${E2UQ}" "netother:${E2UO}"; do
            label="${pair%%:*}"
            r="${pair#*:}"
            case "$r" in
              success|skipped) ;;
              failure)
                xml="e2e-artifacts/e2e-full-ubuntu-${label}/tests/e2e/e2e_junit.xml"
                if [ -f "$xml" ]; then
                  # JUnit 的 <failure>/<error> 元素计数才是真实失败数（grep 行数会漏/误）
                  FAIL_CNT=$(python3 -c "import sys,xml.etree.ElementTree as ET; root=ET.parse('$xml').getroot(); print(len(root.findall('.//failure'))+len(root.findall('.//error')))" 2>/dev/null)
                  if [ -z "${FAIL_CNT:-}" ]; then
                    # XML 存在但解析失败（runner 断连打断写入 = 截断/损坏的半文件）=
                    # 最不可信的输入，绝不可按 0 放行
                    echo "::error::e2e-full-ubuntu-${label}: JUnit exists but unparseable (truncated/corrupt)"
                    exit 1
                  fi
                  if [ "${FAIL_CNT:-0}" -gt 0 ]; then
                    echo "::error::e2e-full-ubuntu-${label}: ${FAIL_CNT} actual test failures in JUnit XML"
                    exit 1
                  fi
                  echo "e2e-full-ubuntu-${label}: failure but 0 actual FAIL (ARM runner disconnect bug)"
                else
                  # job failure 却无 JUnit 产物 = pytest 根本未跑到（编译/依赖/checkout/runner 崩溃）。
                  # 这类 infra 失败正是必须阻断的，不能当作"伪失败"放行。
                  echo "::error::e2e-full-ubuntu-${label}: job failed with no JUnit artifact (never reached pytest)"
                  exit 1
                fi
                ;;
              *) echo "::error::E2E full ubuntu-${label} unexpected: ${r}"; exit 1 ;;
            esac
          done
          # clang-tidy / coverage 为建议性，仅报告不阻断
          echo "=== CI Gate: PASSED ==="
