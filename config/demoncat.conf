[demoncat]
state_file = ~/.demoncat/state.json
log_level  = warn

# ============================================================================
# CPU 模块 (2 条)
# ============================================================================

[fault.rCPU_overload]
module          = cpu
desc            = CPU overload (multi-core burn, pure user-space)
script          = src/scripts/cpu/cpu_overload.sh
supported_ops   = inject,clean,query
inject_required = cores
inject_optional = load_pct
clean_required  = cores
query_optional  = cores

[fault.rCPU_core_offline]
module          = cpu
desc            = CPU core offline via sysfs
script          = src/scripts/cpu/cpu_core_offline.sh
supported_ops   = inject,clean,query
inject_required = cores
clean_required  = cores
query_optional  = cores

# ============================================================================
# 存储模块 (1 条)
# ============================================================================

[fault.rDISK_write_overload]
module          = storage
desc            = Disk write IO overload (dd writers)
script          = src/scripts/storage/disk_write_overload.sh
supported_ops   = inject,clean,query
inject_required = device
inject_optional = workers,size_mb
clean_required  = device
query_optional  = device

# ============================================================================
# 网络模块 (11 条)
# ============================================================================

[fault.rNET_delay]
module          = network
desc            = Network egress delay via tc netem
script          = src/scripts/network/net_delay.sh
supported_ops   = inject,clean,query
inject_required = iface,delay_ms
clean_required  = iface
query_optional  = iface

[fault.rNET_loss]
module          = network
desc            = Network packet loss (tc netem)
script          = src/scripts/network/net_loss.sh
supported_ops   = inject,clean,query
inject_required = iface,loss_pct
clean_required  = iface
query_optional  = iface

[fault.rNET_reorder]
module          = network
desc            = Network packet reorder (tc netem)
script          = src/scripts/network/net_reorder.sh
supported_ops   = inject,clean,query
inject_required = iface,reorder_pct
clean_required  = iface
query_optional  = iface

[fault.rNET_down]
module          = network
desc            = NIC down (ip link)
script          = src/scripts/network/net_down.sh
supported_ops   = inject,clean,query
inject_required = iface
clean_required  = iface
query_optional  = iface

[fault.rNET_degrade]
module          = network
desc            = NIC speed degrade (tc tbf rate-limit)
script          = src/scripts/network/net_degrade.sh
supported_ops   = inject,clean,query
inject_required = iface
inject_optional = speed_mbps
clean_required  = iface
clean_optional  = speed_mbps
query_optional  = iface,speed_mbps

[fault.rNET_port_occupy]
module          = network
desc            = Port occupation (socket holder)
script          = src/scripts/network/net_port_occupy.sh
supported_ops   = inject,clean,query
inject_required = port
inject_optional = protocol
clean_required  = port
clean_optional  = protocol
query_optional  = port,protocol

[fault.rNET_service_stop]
module          = network
desc            = Service stop (systemctl)
script          = src/scripts/network/net_service_stop.sh
supported_ops   = inject,clean,query
inject_required = service
clean_required  = service
query_optional  = service

[fault.rNET_link_flap]
module          = network
desc            = Link flap (ip link down/up loop)
script          = src/scripts/network/net_link_flap.sh
supported_ops   = inject,clean,query
inject_required = iface
inject_optional = cycle_sec,count
clean_required  = iface
clean_optional  = cycle_sec,count
query_optional  = iface,cycle_sec,count

[fault.rNET_bw_limit]
module          = network
desc            = Bandwidth limit (tc tbf)
script          = src/scripts/network/net_bw_limit.sh
supported_ops   = inject,clean,query
inject_required = iface,rate_kbps
clean_required  = iface
query_optional  = iface

[fault.rNET_jitter]
module          = network
desc            = Delay + jitter (tc netem)
script          = src/scripts/network/net_jitter.sh
supported_ops   = inject,clean,query
inject_required = iface,delay_ms,jitter_ms
clean_required  = iface
query_optional  = iface

[fault.rNET_tcp_loss]
module          = network
desc            = TCP packet loss (iptables DROP)
script          = src/scripts/network/net_tcp_loss.sh
supported_ops   = inject,clean,query
inject_required = port
inject_optional = direction
clean_required  = port
clean_optional  = direction
query_optional  = port,direction

# ============================================================================
# 进程模块 (3 条)
# ============================================================================

[fault.rPROC_exit]
module          = process
desc            = Process exit (kill -9, irreversible)
script          = src/scripts/process/proc_exit.sh
supported_ops   = inject
inject_required = pid

[fault.rPROC_hang]
module          = process
desc            = Process hang (SIGSTOP)
script          = src/scripts/process/proc_hang.sh
supported_ops   = inject,clean,query
inject_required = pid
clean_required  = pid
query_optional  = pid

[fault.rPROC_zstate]
module          = process
desc            = Zombie process (kill target → zombie, clean kills parent to reap)
script          = src/scripts/process/proc_zstate.sh
supported_ops   = inject,clean,query
inject_required = pid
clean_required  = pid
query_optional  = pid

