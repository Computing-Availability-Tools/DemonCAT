name: E2E Test

on:
  workflow_call:
    inputs:
      runner:
        description: "JSON array of runs-on labels, e.g. [\"ubuntu-latest\"] or [\"self-hosted\",\"linux-arm64-npu-static-8\"]"
        type: string
        default: '["ubuntu-latest"]'
      mark:
        description: "pytest marker expression; empty string = all (no -m filter)"
        type: string
        default: ""
      run-as-root:
        type: boolean
        default: false
      ref:
        description: "Git ref to checkout; empty = event default"
        type: string
        default: ""
      artifact-name:
        description: "Artifact name suffix; empty = auto by arch (arm64/x86)"
        type: string
        default: ""
      timeout-minutes:
        description: "Job timeout in minutes; smoke=15, full=60"
        type: number
        default: 30

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ inputs.mark || 'ALL' }})
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        id: co1
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}
          # issue_comment 调用方(e2e_command /e2e)checkout fork PR head 触发 pwn 护栏,opt-in;
          # 对 pull_request/nightly 调用者是 no-op(非受信上下文不触发护栏)。
          allow-unsafe-pr-checkout: true
        # NPU 自托管 runner 到 github.com:443 不稳定，仅 self-hosted 时启用 2 次重试（共 3 次尝试）
        continue-on-error: ${{ contains(inputs.runner, 'self-hosted') }}
      - name: Checkout (retry 1/2)
        if: ${{ contains(inputs.runner, 'self-hosted') && steps.co1.outcome == 'failure' }}
        id: co2
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: true
        continue-on-error: true
      - name: Checkout (retry 2/2)
        if: ${{ contains(inputs.runner, 'self-hosted') && steps.co2.outcome == 'failure' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: true

      - name: Install build deps (only if missing)
        run: |
          if ! command -v cmake >/dev/null 2>&1 || ! command -v gcc >/dev/null 2>&1; then
            bash scripts/install_deps.sh --build
          fi

      - name: Install runtime deps
        continue-on-error: true
        run: |
          bash scripts/install_deps.sh --runtime

      - name: Configure
        run: rm -rf build && cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Ensure python3 + curl
        run: |
          command -v python3 >/dev/null 2>&1 || sudo apt-get install -y -qq python3 || bash scripts/install_deps.sh --runtime
          command -v curl >/dev/null 2>&1 || sudo apt-get install -y -qq curl || bash scripts/install_deps.sh --runtime

      - name: Install pytest deps
        run: |
          sudo python3 -m pip install -q --break-system-packages -r tests/e2e/requirements.txt

      - name: Run E2E (pytest)
        env:
          MARK_EXPR: ${{ inputs.mark }}
          AS_ROOT: ${{ inputs.run-as-root }}
        run: |
          # 清除 self-hosted runner 残留 __pycache__（sudo find 确保删 root 拥有的 stale .pyc）
          sudo find tests/e2e -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          MARK=()
          if [ -n "$MARK_EXPR" ]; then
            MARK=(-m "$MARK_EXPR")
          fi
          if [ "$AS_ROOT" = "true" ]; then
            # shellcheck disable=SC2024
            sudo -E bash -c 'PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests/e2e/ --junitxml=tests/e2e/e2e_junit.xml '"${MARK[*]}"' > tests/e2e/e2e_run.log 2>&1'
            sudo chown "$(id -un):$(id -gn)" tests/e2e/e2e_run.log tests/e2e/report.md tests/e2e/results_*.csv tests/e2e/e2e_junit.xml 2>/dev/null || true
          else
            PYTHONDONTWRITEBYTECODE=1 GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" python3 -m pytest tests/e2e/ --junitxml=tests/e2e/e2e_junit.xml "${MARK[@]}" > tests/e2e/e2e_run.log 2>&1
          fi
          cat tests/e2e/e2e_run.log

      - name: E2E summary
        if: always()
        run: |
          if [ -f tests/e2e/report.md ]; then
            cat tests/e2e/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## E2E 摘要"
              echo "_(report.md 未生成: pytest 可能未运行或异常退出)_"
              echo ""
              echo "**日志见 artifact e2e-run.log**"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Print failure summary (on failure)
        if: failure()
        run: |
          echo "===== E2E 失败诊断摘要 ====="
          for f in tests/e2e/failures_*.log; do
            [ -e "$f" ] || continue
            echo "--- $f (失败用例完整 stdout/stderr/verify 输出) ---"
            cat "$f" 2>/dev/null || true
          done
          echo "--- report.md (汇总+失败用例表) ---"
          cat tests/e2e/report.md 2>/dev/null || true
          echo "===== 完整产物已作为 artifact 上传 ====="

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # arch 标签避免 matrix(x86/arm 两腿)同名冲突；
          # 仅上传本次运行相关产物：report.md(含逐用例测试目的) + results_*.csv(含 expected_behavior 列) + 日志
          # 不含 cases.csv(全量用例库 355 行，非本次运行特有，避免 artifact 冗余)
          name: e2e-${{ inputs.artifact-name || ((contains(inputs.runner, 'arm') || contains(inputs.runner, 'ARM')) && 'arm64' || 'x86') }}
          path: |
            tests/e2e/e2e_run.log
            tests/e2e/failures_*.log
            tests/e2e/results_*.csv
            tests/e2e/report.md
            tests/e2e/e2e_junit.xml
          if-no-files-found: ignore
          retention-days: 7
