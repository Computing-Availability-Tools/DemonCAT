name: opencode-review

# opencode 审视 PR:评论 /opencode 或 /oc 触发(issue_comment / pull_request_review_comment)。
#
# PR open/sync 自动审视由 opencode-review-trigger.yaml(primer)间接触发:
# primer 在 pull_request_target 事件发 /opencode 评论(PAT)→ 触发本 workflow(issue_comment)。
# 不直接用 pull_request 事件:fork PR 的 pull_request 会扣留 OPENCODE_API_KEY → opencode 失败;
# 经 primer→issue_comment 绕开(secret 不扣留)。
#
# opencode github action 支持事件:issue_comment / pull_request_review_comment / pull_request /
# issues / schedule / workflow_dispatch。仅不支持 pull_request_target。pull_request 虽支持,
# 但 fork PR 上 secret 扣留,故改用 primer 间接触发(见上)。
#
# fork PR 安全:action 自带 checkoutForkBranch(用 OIDC 换取的 App token 配置 git remote+fetch),
# 本 workflow 不做 fork checkout → 无 pwn 护栏问题。opencode.json 锁只读(bash/edit 全 deny)。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: opencode-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 仅 PR 评论 + /opencode|/oc + (维护者 OR PR 作者) 时跑;issue 评论(issue 无 pull_request)不跑
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc')) &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        github.event.comment.user.login == github.event.issue.user.login ||
        github.event.comment.user.login == 'github-actions[bot]')) ||
      (github.event_name == 'pull_request_review_comment' &&
       (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc')) &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        github.event.comment.user.login == github.event.pull_request.user.login ||
        github.event.comment.user.login == 'github-actions[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          # 不设 prompt:opencode 用 /opencode 评论内容作任务。
          # DemonCAT 审视规则全在仓库根 AGENTS.md(opencode 自动读取)。
