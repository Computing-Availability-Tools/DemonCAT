name: E2E_Light

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint (pre-commit + PR title)
    uses: ./.github/workflows/_pre_commit.yaml

  unit-test:
    name: Unit tests (${{ matrix.runner }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    uses: ./.github/workflows/_unit_test.yaml
    with:
      runner: ${{ matrix.runner }}

  e2e-light:
    name: E2E smoke (${{ matrix.runner }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    uses: ./.github/workflows/_e2e_test.yaml
    with:
      runner: '["${{ matrix.runner }}"]'
      # 冒烟核心用例（非 root 可跑，覆盖 PR 易引入严重回归的核心不变量）：
      # [功能 happy-path] 各非硬件模块 inject→clean→query 全链路
      #   FUNC-rCPU_overload       CPU (perl 自旋)
      #   FUNC-rDISK_write_overload 存储 (dd 写 /tmp)
      #   FUNC-rPROC_hang          进程 (hang 自有进程)
      #   FUNC-rPROC_zstate        进程 (zombie 回收)
      #   FUNC-PLG                 动态插件 dlopen (核心扩展性)
      #   FUNC-Q1                  query<uid> confirmed (状态跟踪)
      # [状态引擎一致性] STATE-1..6：clean×2 幂等 / stateless clean /
      #   --force 替换 / 重注入拒绝 / query 幂等 / 多资源隔离
      # [状态韧性] RES-1..5：state 丢失/损坏/孤儿/幽灵恢复 / clean--all 幂等
      # [并发安全] CONC-1..3：并发 inject+clean / 双进程写 state / clean--all+inject
      # 排除 STATE-7(NPU)/RES-6(rNET_port_occupy 压测)/RES-7(NPU)；网络/NPU/core_offline 留给 full/nightly
      flows: "CLI,FUNC-rCPU_overload,FUNC-rDISK_write_overload,FUNC-rPROC_hang,FUNC-rPROC_zstate,FUNC-PLG,FUNC-Q1,STATE,RES,CONC"
      exclude: "STATE-7,RES-6,RES-7"
      run-as-root: false

  ci-gate:
    name: CI Gate (required status check)
    needs: [lint, unit-test, e2e-light]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit-test.result }}
          E2E: ${{ needs.e2e-light.result }}
        run: |
          set -eu
          echo "=== PR Light CI Gate Summary ==="
          echo "lint:       ${LINT}"
          echo "unit-test:  ${UNIT}"
          echo "e2e-light:  ${E2E}"
          for r in "${LINT}" "${UNIT}" "${E2E}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::One or more required jobs did not succeed (see above)"; exit 1 ;;
            esac
          done
          echo "=== CI Gate: PASSED ==="
