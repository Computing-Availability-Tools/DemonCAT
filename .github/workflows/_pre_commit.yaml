name: Pre-Commit

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout (branch/tag/sha); empty = event default (PR merge ref / push ref)"
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  pre-commit:
    name: pre-commit (lint / format / PR title)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate PR title (conventional commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eu
          [ -n "$PR_TITLE" ] || { echo "::error::PR title is empty"; exit 1; }
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|merge)(\([^)]+\))?: .+'
          printf '%s\n' "$PR_TITLE" | grep -qE "$pattern" \
            || { echo "::error::PR title must follow Conventional Commits: '<type>(<scope>): <desc>'"; \
                 echo "::error::Allowed types: feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|merge"; \
                 echo "::error::Got: $PR_TITLE"; exit 1; }
          echo "PR title OK: $PR_TITLE"

      - name: Install pre-commit + system tools
        run: |
          pip install pre-commit
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format shellcheck

      - name: Cache pre-commit envs
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/workflows/matchers/actionlint.json"
          echo "::add-matcher::.github/workflows/matchers/markdownlint.json"
          echo "::add-matcher::.github/workflows/matchers/shellcheck.json"

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
