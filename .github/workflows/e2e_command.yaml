name: E2E Command

# 评论 /e2e → 校验评论者权限（PR author 或 triage+）→ 切换 `ready` 标签(先移除再加)
# → 触发 pr_test.yaml 的 labeled 事件 → 跑 Full 套件（含 fork PR，vllm 式）。
# 仅用 GITHUB_TOKEN，无需 PAT。实现参考 vllm-ascend pr_e2e_command.yml（简化为加标签间接）。
#
# 前置：源仓库需存在标签 `ready`（pr_test.yaml Full 门控即 ready/ready-for-test）。
#   用 ready 而非 ready-for-test：ready 通常已存在,且 remove-then-add 强制产生新 labeled 事件
#   （同标签重复 add 不触发新事件；先 remove 触发 unlabeled,再 add 触发 labeled）。
# 关键：issue_comment workflow 只从【默认分支】读取——本文件必须在源仓库默认分支上才会被 /e2e 触发。
#   若默认分支(如 main)没有本文件,改默认分支为 develop 或把本文件合并到默认分支。
# 安全：issue_comment workflow 从默认分支读取（不会被 PR 改）；fork PR 的 pull_request 事件下
#       GitHub 自动屏蔽源仓库 secrets，e2e-full 的 GITHUB_TOKEN 为只读（contents: read）。

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write   # 加标签 + 回写评论
  issues: read

concurrency:
  group: e2e-command-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  e2e-command:
    if: ${{ github.event.issue.pull_request != null && github.event.comment.user.type == 'User' && startsWith(github.event.comment.body, '/e2e') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve PR (number + author)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.issue.number }}
        run: |
          set -eux
          # 用 REST API 显式 owner/repo(issue_comment 无 checkout,gh pr view 推断 repo 偶发失败)
          PR_AUTHOR=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUM}" --jq '.user.login')
          {
            echo "pr_number=${PR_NUM}"
            echo "pr_author=${PR_AUTHOR}"
          } >> "$GITHUB_OUTPUT"

      - name: Check commenter authorization
        id: auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.comment.user.login }}
          PR_AUTHOR: ${{ steps.pr.outputs.pr_author }}
        run: |
          set -eu
          # PR author 可直接触发；否则须 triage+ 权限（照搬 vllm-ascend 鉴权逻辑）
          if [ "$ACTOR" = "$PR_AUTHOR" ]; then
            echo "authorized=true (PR author)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ROLE=$(gh api "repos/${{ github.repository }}/collaborators/$ACTOR/permission" --jq '.role_name' 2>/dev/null || echo "")
          case "$ROLE" in
            triage|write|maintain|admin)
              echo "authorized=true ($ROLE)" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Reject unauthorized
        if: steps.auth.outputs.authorized != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
        run: |
          gh pr comment "$PR_NUM" --repo "${{ github.repository }}" --body "/e2e 拒绝 — 仅 PR 作者或 triage+ 权限可触发。"
          exit 1

      - name: Trigger full via label
        if: steps.auth.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -eu
          # 用 ready 标签触发 pr_test.yaml labeled → Full。先移除(若在)再加,强制新 labeled 事件:
          # 同标签重复 add 不触发新事件;remove 触发 unlabeled,add 触发 labeled。
          gh pr edit "$PR_NUM" --repo "${{ github.repository }}" --remove-label "ready" 2>/dev/null || true
          gh pr edit "$PR_NUM" --repo "${{ github.repository }}" --add-label "ready"
          gh pr comment "$PR_NUM" --repo "${{ github.repository }}" --body "/e2e 已触发：已(重新)加 \`ready\` 标签 → Full 套件即将在 pr_test.yaml 启动。"
