[demoncat]
state_file = ~/.demoncat/state.json
log_level  = warn

[fault.rCPU_overload]
module          = cpu
desc            = CPU 过载（多核 burn）
script          = src/scripts/cpu/cpu_overload.sh
supported_ops   = inject,clean,query
required_params = cores

[fault.rNET_delay]
module          = network
desc            = 网络延时（tc netem delay）
script          = src/scripts/network/net_delay.sh
supported_ops   = inject,clean,query
required_params = iface,delay_ms

[fault.rPROC_exit]
module          = process
desc            = 进程异常退出（kill -9，不可恢复）
script          = src/scripts/process/proc_exit.sh
supported_ops   = inject
required_params = pid
