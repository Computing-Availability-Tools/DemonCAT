name: Nightly_Test_A2

# 夜间全量测试：自托管 NPU runner 跑全量 E2E（含 NPU/硬件用例）。
# push 触发仅走 lint + unit-test（轻量），NPU E2E 仅在 schedule/dispatch 时运行。
on:
  push:
    branches:
      - '*'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint (pre-commit)
    uses: ./.github/workflows/_pre_commit.yaml

  unit-test:
    name: Unit tests (ctest)
    needs: lint
    uses: ./.github/workflows/_unit_test.yaml
    with:
      runner: ubuntu-latest

  e2e-full:
    name: E2E full (all flows, root, NPU runner)
    needs: lint
    if: ${{ github.event_name != 'push' }}
    uses: ./.github/workflows/_e2e_test.yaml
    with:
      runner: '["self-hosted", "linux-arm64-npu-static-8"]'
      flows: ""
      exclude: ""
      run-as-root: true

  clang-tidy:
    name: clang-tidy (advisory)
    needs: lint
    if: ${{ github.event_name != 'push' }}
    uses: ./.github/workflows/_clang_tidy.yaml

  ci-gate:
    name: Nightly Gate
    needs: [lint, unit-test, e2e-full, clang-tidy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit-test.result }}
          E2E: ${{ needs.e2e-full.result }}
          CLANG: ${{ needs.clang-tidy.result }}
          IS_PUSH: ${{ github.event_name == 'push' }}
        run: |
          set -eu
          echo "=== Nightly Gate Summary ==="
          echo "lint:        ${LINT}"
          echo "unit-test:  ${UNIT}"
          echo "e2e-full:   ${E2E}"
          echo "clang-tidy: ${CLANG} (advisory)"
          echo "is_push:    ${IS_PUSH}"
          for r in "${LINT}" "${UNIT}"; do
            case "$r" in
              success) ;;
              *) echo "::error::Job did not succeed: ${r}"; exit 1 ;;
            esac
          done
          if [ "${IS_PUSH}" != "true" ]; then
            for r in "${E2E}"; do
              case "$r" in
                success) ;;
                *) echo "::error::Job did not succeed: ${r}"; exit 1 ;;
              esac
            done
          fi
          echo "=== Nightly Gate: PASSED ==="
