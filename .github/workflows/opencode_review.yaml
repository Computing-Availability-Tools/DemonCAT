name: opencode-review

# opencode 审视 PR:评论 /opencode 或 /oc 触发(issue_comment / pull_request_review_comment)。
# primer(opencode-review-trigger.yaml)在 PR open/sync 自动发 /opencode 评论(PAT)间接触发本 workflow。
#
# 并发:同 PR 最多 3 个并发 review。
#   - concurrency 按 comment.id 拆组 → 同 PR 多个 /opencode 不互相取消(允许并发,打开限制)。
#   - gate job 用 check-run 数同 PR head SHA 上 in_progress 的 "opencode-review" check-run,
#     >=3 则跳过(发 notice);<3 则 review job 创建 in_progress check-run 占位,review 完(always)
#     补 complete 释放。check-run 按 head SHA 天然按 PR 隔离(issue_comment 的 gh run list 无法按 PR 过滤,
#     故用 check-run)。race-prone(多 gate 同时数到 <3 可能都进),best-effort 上限。
#
# fork PR 安全:action 自带 checkoutForkBranch(用 OIDC 换取的 App token 配置 git remote+fetch),
# 本 workflow 不做 fork checkout → 无 pwn 护栏问题。CI 用配置在 .github/opencode-ci.json
# (经 OPENCODE_CONFIG 显式加载,锁只读:bash/edit 全 deny);根目录不放 opencode.json,不影响本地。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: read
  checks: write   # 创建/查询 check-run 做 3 并发上限

concurrency:
  group: opencode-review-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  gate:
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (startsWith(github.event.comment.body, '/opencode') || startsWith(github.event.comment.body, '/oc')) &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        github.event.comment.user.login == github.event.issue.user.login)) ||
      (github.event_name == 'pull_request_review_comment' &&
       (startsWith(github.event.comment.body, '/opencode') || startsWith(github.event.comment.body, '/oc')) &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        github.event.comment.user.login == github.event.pull_request.user.login))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      check_run_id: ${{ steps.claim.outputs.check_run_id }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -eu
          SHA=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
      - id: check
        env:
          # GITHUB_TOKEN(GitHub Actions app 签发)按 permissions 块得 checks:write,可读 check-run。
          # 不用 PAT:checks 写权限仅 GitHub App,classic PAT/OAuth 无法 create/update check-run(REST 文档)。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -eu
          # 只数近 30 分钟内 started_at 的 in_progress check-run,防 workflow 被 cancel 导致
          # release(always()) 没跑、in_progress 占位泄漏 → gate 计数永久 >=3 → review 被永久跳过。
          COUNT=$(gh api "repos/${{ github.repository }}/commits/${SHA}/check-runs?status=in_progress" --jq '[.check_runs[] | select(.name == "opencode-review" and (.started_at | fromdateiso8601) > (now - 1800))] | length')
          echo "concurrent=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -ge 3 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::opencode review 达 3 并发上限(近 30min 内已有 $COUNT 个 in_progress on ${{ steps.pr.outputs.head_sha }}),跳过本次。"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
      - id: claim
        if: steps.check.outputs.proceed == 'true'
        uses: actions/github-script@v9
        with:
          # GITHUB_TOKEN(GitHub Actions app 签发)能 create check-run;classic PAT 不能(checks 写权限仅 GitHub App,REST 文档明确)。
          # fork PR 的 issue_comment 下 GITHUB_TOKEN 仍得 checks:write(read-only 仅限 pull_request 事件)。
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = '${{ steps.pr.outputs.head_sha }}';
            const res = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'opencode-review',
              head_sha: sha,
              status: 'in_progress',
              started_at: new Date().toISOString(),
            });
            core.setOutput('check_run_id', String(res.data.id));

  review:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI 专用 opencode 配置(模型/share/只读权限),仅本 job 经 OPENCODE_CONFIG 显式加载。
          # 根目录不放 opencode.json,避免项目配置覆盖本地用户的全局配置。
          OPENCODE_CONFIG: ${{ github.workspace }}/.github/opencode-ci.json
        with:
          model: opencode/nemotron-3-ultra-free
          use_github_token: true
          # 不设 prompt:opencode 用 /opencode 评论内容作任务。
          # DemonCAT 审视规则全在仓库根 AGENTS.md(opencode 自动读取)。

  release:
    needs: [gate, review]
    if: always() && needs.gate.outputs.check_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const id = Number('${{ needs.gate.outputs.check_run_id }}');
            const result = '${{ needs.review.result }}';
            const conclusion = result === 'success' ? 'success' : 'failure';
            try {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: id,
                status: 'completed',
                conclusion: conclusion,
                completed_at: new Date().toISOString(),
              });
            } catch (e) {
              core.warning(`failed to complete check-run ${id}: ${e.message}`);
            }
