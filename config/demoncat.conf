[demoncat]
state_file = ~/.demoncat/state.json
log_level  = warn

[fault.rCPU_overload]
module          = cpu
desc            = CPU overload (multi-core burn)
script          = config/scripts/cpu/cpu_overload.sh
supported_ops   = inject,clean,query
required_params = cores

[fault.rCPU_core_offline]
module          = cpu
desc            = CPU core offline via sysfs
script          = config/scripts/cpu/cpu_core_offline.sh
supported_ops   = inject,clean,query
required_params = cores

[fault.rCPU_overload_yes]
module          = cpu
desc            = CPU overload via yes (per-core, has syscall overhead ~70% sy)
script          = config/scripts/cpu/cpu_overload_yes.sh
supported_ops   = inject,clean,query
required_params = cores

[fault.rDISK_write_overload]
module          = storage
desc            = Disk write IO overload (dd writers)
script          = config/scripts/storage/disk_write_overload.sh
supported_ops   = inject,clean,query
required_params = device
optional_params = workers,size_mb

[fault.rNET_delay]
module          = network
desc            = Network egress delay via tc netem
script          = config/scripts/network/net_delay.sh
supported_ops   = inject,clean,query
required_params = iface,delay_ms

[fault.rNET_loss]
module          = network
desc            = Network packet loss (tc netem)
script          = config/scripts/network/net_loss.sh
supported_ops   = inject,clean,query
required_params = iface,loss_pct

[fault.rNET_reorder]
module          = network
desc            = Network packet reorder (tc netem)
script          = config/scripts/network/net_reorder.sh
supported_ops   = inject,clean,query
required_params = iface,reorder_pct

[fault.rNET_down]
module          = network
desc            = NIC down (ip link)
script          = config/scripts/network/net_down.sh
supported_ops   = inject,clean,query
required_params = iface

[fault.rNET_degrade]
module          = network
desc            = NIC speed degrade (ethtool)
script          = config/scripts/network/net_degrade.sh
supported_ops   = inject,clean,query
required_params = iface
optional_params = speed_mbps

[fault.rNET_port_occupy]
module          = network
desc            = Port occupation (socket holder)
script          = config/scripts/network/net_port_occupy.sh
supported_ops   = inject,clean,query
required_params = port
optional_params = protocol

[fault.rNET_service_stop]
module          = network
desc            = Service stop (systemctl)
script          = config/scripts/network/net_service_stop.sh
supported_ops   = inject,clean,query
required_params = service

[fault.rNET_link_flap]
module          = network
desc            = Link flap (ip link down/up loop)
script          = config/scripts/network/net_link_flap.sh
supported_ops   = inject,clean,query
required_params = iface
optional_params = cycle_sec,count

[fault.rNET_bw_limit]
module          = network
desc            = Bandwidth limit (tc tbf)
script          = config/scripts/network/net_bw_limit.sh
supported_ops   = inject,clean,query
required_params = iface,rate_kbps

[fault.rNET_jitter]
module          = network
desc            = Delay + jitter (tc netem)
script          = config/scripts/network/net_jitter.sh
supported_ops   = inject,clean,query
required_params = iface,delay_ms,jitter_ms

[fault.rNET_tcp_loss]
module          = network
desc            = TCP packet loss (iptables DROP)
script          = config/scripts/network/net_tcp_loss.sh
supported_ops   = inject,clean,query
required_params = port
optional_params = direction

[fault.rPROC_exit]
module          = process
desc            = Process exit (kill -9, irreversible)
script          = config/scripts/process/proc_exit.sh
supported_ops   = inject
required_params = pid

[fault.rPROC_dstate]
module          = process
desc            = D-state processes (uninterruptible IO)
script          = config/scripts/process/proc_dstate.sh
supported_ops   = inject,clean,query
required_params = count

[fault.rPROC_hang]
module          = process
desc            = Process hang (SIGSTOP)
script          = config/scripts/process/proc_hang.sh
supported_ops   = inject,clean,query
required_params = pid

[fault.rPROC_zstate]
module          = process
desc            = Zombie processes (fork+exit without wait)
script          = config/scripts/process/proc_zstate.sh
supported_ops   = inject,clean,query
required_params = count

[fault.rNPU_link_down]
module          = npu
desc            = RoCE link down (hccn_tool -cfg recovery)
script          = config/scripts/npu/link_down.sh
supported_ops   = inject,clean,query
required_params = chip

[fault.rNPU_ip_change]
module          = npu
desc            = RoCE IP change
script          = config/scripts/npu/ip_change.sh
supported_ops   = inject,clean,query
required_params = chip,address,netmask

[fault.rNPU_gw_change]
module          = npu
desc            = RoCE gateway change
script          = config/scripts/npu/gw_change.sh
