name: Unit Tests

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      coverage:
        description: "Enable C coverage instrumentation (Debug+gcov) + lcov collect + Codecov upload"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit tests (ctest)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install build deps (only if missing)
        run: |
          if ! command -v cmake >/dev/null 2>&1 || ! command -v gcc >/dev/null 2>&1; then
            bash scripts/install_deps.sh --build
          fi

      - name: Configure
        env:
          COVERAGE: ${{ inputs.coverage }}
        run: |
          if [ "$COVERAGE" = "true" ]; then
            # Debug + 覆盖率插桩（-O0 避免 inline，行/分支覆盖率更准）
            cmake -B build -DCMAKE_BUILD_TYPE=Debug -DDCAT_COVERAGE=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          fi

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run ctest
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --timeout 60 --output-junit ctest-junit.xml 2>&1 | tee build/ctest_run.log

      - name: Unit test summary
        if: always()
        run: python3 tests/ctest_summary.py

      - name: Collect coverage (lcov)
        if: ${{ !cancelled() && inputs.coverage }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lcov
          lcov --capture --directory build --output-file coverage.info --rc branch_coverage=1
          # 排除第三方库、测试驱动自身、系统头，只保留 src/ 业务代码覆盖率
          # --ignore-errors unused: lcov 2.0 把未命中的排除模式(如 /usr/* 系统头未入覆盖)当 ERROR exit 25，需显式忽略
          lcov --remove coverage.info 'third_party/*' '/usr/*' 'tests/*' --output-file coverage.info --ignore-errors unused
          # 汇总写入 job summary（Actions run 页直接可见，免翻日志）
          {
            echo "## Coverage Summary"
            echo '```'
            lcov --summary coverage.info
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 生成可浏览的逐行 HTML 报告（下载 coverage-html artifact 后用浏览器打开 index.html）
          # --rc genhtml_charset=UTF-8: 源码含 UTF-8 中文注释，genhtml 默认 iso_8859_1 会导致乱码
          genhtml coverage.info --output-directory coverage-html --branch-coverage --legend --ignore-errors unused --rc genhtml_charset=UTF-8

      - name: Upload to Codecov
        if: ${{ !cancelled() && inputs.coverage }}
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage HTML report
        if: ${{ !cancelled() && inputs.coverage }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-html
          path: coverage-html/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload ctest logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ctest-logs-${{ contains(inputs.runner, 'arm') && 'arm64' || 'x86' }}
          path: |
            build/ctest_run.log
            build/ctest-junit.xml
            build/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
