name: opencode-review

# opencode 审视 PR:评论 /opencode 或 /oc 触发(issue_comment / pull_request_review_comment)。
#
# opencode github action 仅支持 issue_comment 与 pull_request_review_comment 事件
# (assertContextEvent 白名单),不支持 pull_request/pull_request_target → "自动审视 PR open" 不可行,
# 改为评论驱动。
#
# fork PR 安全:action 自带 checkoutForkBranch(用 OIDC 换取的 App token 配置 git remote+fetch),
# 本 workflow 不做 fork checkout → 无 actions/checkout pwn 护栏问题,无需 allow-unsafe-pr-checkout。
# opencode.json 锁只读(bash/edit/write/patch/webfetch/websearch/task 全 deny)→ 仅 read/grep/glob/lsp。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: opencode-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 仅 PR 评论 + /opencode|/oc + (维护者 OR PR 作者) 时跑;issue 评论(issue 无 pull_request)不跑
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc')) &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        github.event.comment.user.login == github.event.issue.user.login ||
        github.event.comment.user.login == 'github-actions[bot]')) ||
      (github.event_name == 'pull_request_review_comment' &&
       (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc')) &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        github.event.comment.user.login == github.event.pull_request.user.login ||
        github.event.comment.user.login == 'github-actions[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          # 不设 prompt:opencode 用 /opencode 评论内容作任务。
          # DemonCAT 审视规则全在仓库根 AGENTS.md(opencode 自动读取)。
